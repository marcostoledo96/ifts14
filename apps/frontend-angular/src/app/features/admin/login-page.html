<a class="skip-link" href="#contenido">Saltar al contenido principal</a>
<div class="login-layout">
  <aside class="login-aside" aria-label="Información institucional">
    <span class="monograma" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="6" height="6" fill="currentColor" />
        <rect x="12" y="2" width="6" height="6" fill="var(--color-circuit)" />
        <rect x="2" y="12" width="6" height="6" fill="var(--color-circuit)" />
        <rect x="12" y="12" width="6" height="6" fill="currentColor" />
      </svg>
    </span>
    <p class="aside-kicker">IFTS N.° 14 — Panel administrativo</p>
    <h1 class="aside-title">Acceso administrativo</h1>
    <p class="aside-simulacion" role="note">
      Acceso administrativo — autenticación con credenciales institucionales
    </p>
    <dl class="estado-sistema">
      <dt>Estado del sistema</dt>
      <dd><span class="dot dot-valid" aria-hidden="true"></span> Operativo</dd>
      <dt>Protocolo</dt>
      <dd>Sesión con cookie HttpOnly + CSRF</dd>
    </dl>
  </aside>
  <main class="login-main" id="contenido" role="main">
    <section class="card">
      <h2 class="card-title">Iniciar sesión</h2>
      @if (errorMsg()) {
        <p class="error-login" role="alert" tabindex="-1">{{ errorMsg() }}</p>
      }
      <app-login-form (accesoSimulado)="onAccesoSimulado($event)" />
    </section>
  </main>
</div>
