<form class="form" (ngSubmit)="enviar()" novalidate>
  <fieldset class="fieldset">
    <legend class="legend">Credenciales de acceso (simuladas)</legend>

    <div class="campo">
      <label class="label" for="login-usuario">ID institucional</label>
      <input
        id="login-usuario"
        name="usuario"
        type="text"
        autocomplete="username"
        [value]="usuario()"
        (input)="onUsuario($event)"
        [attr.aria-invalid]="errorMsg() ? true : null"
        [attr.aria-describedby]="errorMsg() ? 'login-error' : null"
        required
      />
    </div>

    <div class="campo">
      <label class="label" for="login-clave">Clave de acceso</label>
      <input
        id="login-clave"
        name="clave"
        type="password"
        autocomplete="current-password"
        [value]="clave()"
        (input)="onClave($event)"
        [attr.aria-invalid]="errorMsg() ? true : null"
        [attr.aria-describedby]="errorMsg() ? 'login-error' : null"
        required
      />
    </div>

    @if (errorMsg()) {
      <p id="login-error" class="error" role="alert" tabindex="-1">
        {{ errorMsg() }}
      </p>
    }

    <p class="simulacion">
      Acceso simulado — la autenticación real se define en una fase posterior
    </p>

    <button type="submit" class="submit">Iniciar sesión</button>
  </fieldset>
</form>
