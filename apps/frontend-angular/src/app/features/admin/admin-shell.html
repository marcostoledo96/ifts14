<a class="skip-link" href="#contenido">Saltar al contenido principal</a>
<div class="layout">
  <aside class="sidebar-desktop" aria-label="Navegación admin">
    <app-sidebar-admin [active]="rutaActual()" (cerrarSesion)="cerrarSesion()" />
  </aside>
  <div class="content" [attr.inert]="menuAbierto() ? '' : null">
    <header class="topbar" role="banner">
      <div class="topbar-row">
        <button
          type="button"
          class="menu-btn"
          aria-label="Abrir navegación admin"
          aria-expanded="{{ menuAbierto() }}"
          [attr.aria-controls]="menuAbierto() ? 'admin-drawer' : null"
          (click)="abrirMenu()"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <label class="topbar-search">
          <svg
            class="topbar-search-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
          <span class="sr-only">Buscar curso, alumno o certificado</span>
          <input
            type="search"
            name="admin-search"
            placeholder="Buscar curso, alumno o certificado…"
            autocomplete="off"
          />
        </label>

        <div class="topbar-actions">
          <span class="topbar-sync">
            <span class="topbar-sync-dot" aria-hidden="true"></span>
            <span class="topbar-sync-label">Sincronizado 10:42</span>
          </span>
          <button type="button" class="topbar-icon-btn" aria-label="Ayuda">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
              <path d="M12 17h.01" />
            </svg>
          </button>
          <button type="button" class="topbar-icon-btn topbar-bell" aria-label="Notificaciones">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M10.268 21a2 2 0 0 0 3.464 0" />
              <path
                d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"
              />
            </svg>
            <span class="topbar-bell-dot" aria-hidden="true"></span>
          </button>
          <span class="topbar-avatar" aria-hidden="true">AD</span>
        </div>
      </div>
    </header>
    <main id="contenido" role="main">
      <router-outlet />
    </main>
    <footer role="contentinfo">
      <p>Instituto de Formación Técnica Superior N.º 14 — Panel administrativo</p>
    </footer>
  </div>
</div>
<!-- Drawer mobile: overlay + panel condicional. Solo visible < 64rem.
     Click en overlay cierra. Render condicional para que el contenido
     focusable (nav/logout) NO quede expuesto a teclado/screen readers
     cuando el drawer está cerrado. -->
@if (menuAbierto()) {
  <div class="drawer-overlay" (click)="cerrarMenu()" aria-hidden="true"></div>
  <aside
    id="admin-drawer"
    class="drawer-mobile drawer-open"
    role="navigation"
    aria-label="Navegación admin (móvil)"
  >
    <app-sidebar-admin [active]="rutaActual()" (cerrarSesion)="cerrarSesion()" />
  </aside>
}
