<a class="skip-link" href="#contenido">Saltar al contenido principal</a>
@if (navegando()) {
  <div
    class="nav-progress"
    role="progressbar"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-label="Cargando página"
  >
    <span class="nav-progress-bar" aria-hidden="true"></span>
  </div>
}
<div class="layout">
  <aside class="sidebar-desktop" aria-label="Navegación admin">
    <app-sidebar-admin
      [active]="rutaActual()"
      [navegando]="navegando()"
      [rutaPendiente]="rutaPendiente()"
      [logoutDisabled]="cerrandoSesion()"
      (cerrarSesion)="cerrarSesion()"
    />
  </aside>
  <div class="content" [attr.inert]="menuAbierto() ? '' : null">
    <header class="mobile-nav" role="banner">
      <button
        type="button"
        class="menu-btn"
        aria-label="Abrir navegación admin"
        [attr.aria-expanded]="menuAbierto()"
        [attr.aria-controls]="menuAbierto() ? 'admin-drawer' : null"
        (click)="abrirMenu()"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </header>
    <main id="contenido" role="main" [attr.aria-busy]="navegando() ? 'true' : null">
      <router-outlet />
    </main>
    <footer role="contentinfo">
      <p>Instituto de Formación Técnica Superior N.º 14 — Panel administrativo</p>
    </footer>
  </div>
</div>
@if (menuAbierto()) {
  <div class="drawer-layer" #drawerLayer>
    <button
      type="button"
      class="drawer-overlay"
      aria-label="Cerrar menú"
      (click)="cerrarMenu()"
    ></button>
    <aside
      id="admin-drawer"
      class="drawer-mobile drawer-open"
      role="dialog"
      aria-modal="true"
      aria-label="Navegación admin (móvil)"
    >
      <app-sidebar-admin
        [active]="rutaActual()"
        [navegando]="navegando()"
        [rutaPendiente]="rutaPendiente()"
        [mostrarCerrar]="true"
        [logoutDisabled]="cerrandoSesion()"
        (cerrarMenu)="cerrarMenu()"
        (cerrarSesion)="cerrarSesion()"
      />
    </aside>
  </div>
}
