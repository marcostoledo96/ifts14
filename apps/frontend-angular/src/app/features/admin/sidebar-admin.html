<nav class="sidebar" role="navigation" aria-label="Navegación admin">
  <div class="sidebar-brand">
    <span class="sidebar-brand-mark">
      <img
        class="sidebar-brand-img"
        [src]="logoSrc"
        alt=""
        width="52"
        height="52"
        decoding="async"
      />
    </span>
    <div class="sidebar-brand-text">
      <p class="sidebar-brand-title">IFTS N.° 14</p>
      <p class="sidebar-brand-sub">Bedelía · Panel</p>
    </div>
    @if (mostrarCerrar()) {
      <button
        type="button"
        class="sidebar-close"
        aria-label="Cerrar menú"
        (click)="cerrarMenu.emit()"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    }
  </div>

  <div class="sidebar-nav">
    <p class="sidebar-heading">Operación</p>
    <ul class="nav-list nav-list--operacion">
      @for (item of items; track item.label) {
        <li>
          @if (item.route; as route) {
            <a
              [routerLink]="route"
              [attr.aria-current]="isActive(item) ? 'page' : null"
              [attr.aria-busy]="isNavigatingTo(item) ? 'true' : null"
              [class.active]="isActive(item)"
              [class.nav-loading]="isNavigatingTo(item)"
            >
              <span class="nav-active-bar" aria-hidden="true"></span>
              <ng-container *ngTemplateOutlet="navIcon; context: { $implicit: item.iconId }" />
              <span class="nav-label">{{ item.label }}</span>
              @if (isNavigatingTo(item)) {
                <app-ui-spinner size="sm" class="nav-spinner" />
              }
            </a>
          } @else {
            <button type="button" class="nav-placeholder" disabled aria-disabled="true">
              <ng-container *ngTemplateOutlet="navIcon; context: { $implicit: item.iconId }" />
              <span>{{ item.label }}</span>
            </button>
          }
        </li>
      }
    </ul>
  </div>

  <div class="sidebar-footer">
    <ul class="nav-list">
      <li>
        <a
          [routerLink]="configItem.route!"
          [attr.aria-current]="isActive(configItem) ? 'page' : null"
          [attr.aria-busy]="isNavigatingTo(configItem) ? 'true' : null"
          [class.active]="isActive(configItem)"
          [class.nav-loading]="isNavigatingTo(configItem)"
        >
          <span class="nav-active-bar" aria-hidden="true"></span>
          <ng-container *ngTemplateOutlet="navIcon; context: { $implicit: configItem.iconId }" />
          <span class="nav-label">{{ configItem.label }}</span>
          @if (isNavigatingTo(configItem)) {
            <app-ui-spinner size="sm" class="nav-spinner" />
          }
        </a>
      </li>
      <li>
        <button type="button" class="logout-btn" (click)="cerrarSesion.emit()">
          <ng-container *ngTemplateOutlet="navIcon; context: { $implicit: 'log-out' }" />
          <span>Cerrar sesión</span>
        </button>
      </li>
    </ul>
  </div>
</nav>

<!-- Iconos Lucide-like (stroke 1.75, 16×16). Sin dependencia npm. -->
<ng-template #navIcon let-iconId>
  <svg
    width="16"
    height="16"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    @switch (iconId) {
      @case ('layout-grid') {
        <rect width="7" height="7" x="3" y="3" rx="1" />
        <rect width="7" height="7" x="14" y="3" rx="1" />
        <rect width="7" height="7" x="14" y="14" rx="1" />
        <rect width="7" height="7" x="3" y="14" rx="1" />
      }
      @case ('book-open') {
        <path d="M12 7v14" />
        <path
          d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"
        />
      }
      @case ('users') {
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <path d="M16 3.128a4 4 0 0 1 0 7.744" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
        <circle cx="9" cy="7" r="4" />
      }
      @case ('calendar-check') {
        <path d="M8 2v4" />
        <path d="M16 2v4" />
        <rect width="18" height="18" x="3" y="4" rx="2" />
        <path d="M3 10h18" />
        <path d="m9 16 2 2 4-4" />
      }
      @case ('qr-code') {
        <rect width="5" height="5" x="3" y="3" rx="1" />
        <rect width="5" height="5" x="16" y="3" rx="1" />
        <rect width="5" height="5" x="3" y="16" rx="1" />
        <path d="M21 16h-3a2 2 0 0 0-2 2v3" />
        <path d="M21 21v.01" />
        <path d="M12 7v3a2 2 0 0 1-2 2H7" />
        <path d="M3 12h.01" />
        <path d="M12 3h.01" />
        <path d="M12 16v.01" />
        <path d="M16 12h1" />
        <path d="M21 12v.01" />
        <path d="M12 21v-1" />
      }
      @case ('settings') {
        <path
          d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
        />
        <circle cx="12" cy="12" r="3" />
      }
      @case ('log-out') {
        <path d="m16 17 5-5-5-5" />
        <path d="M21 12H9" />
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      }
    }
  </svg>
</ng-template>
