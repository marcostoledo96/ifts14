<nav class="sidebar" role="navigation" aria-label="Navegación admin">
  <p class="sidebar-heading">Secciones</p>
  <ul class="nav-list">
    @for (item of items; track item.label) {
      <li>
        @if (item.route; as route) {
          <a
            [routerLink]="route"
            [attr.aria-current]="isActive(item) ? 'page' : null"
            [class.active]="isActive(item)"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path [attr.d]="item.icon" />
            </svg>
            <span>{{ item.label }}</span>
          </a>
        } @else {
          <button type="button" class="nav-placeholder" disabled aria-disabled="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path [attr.d]="item.icon" />
            </svg>
            <span>{{ item.label }}</span>
          </button>
        }
      </li>
    }
  </ul>
  <div class="logout">
    <button type="button" class="logout-btn" (click)="cerrarSesion.emit()">
      Cerrar sesión
    </button>
  </div>
</nav>
