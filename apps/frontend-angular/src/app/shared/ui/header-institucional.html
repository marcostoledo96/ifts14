<header class="header" role="banner">
  <div class="header-row">
    <span class="monograma">
      <img
        class="monograma-img"
        [src]="logoSrc"
        alt=""
        width="40"
        height="40"
        decoding="async"
      />
    </span>
    <div class="header-titles">
      <p class="header-title">IFTS N.° 14</p>
      <p class="header-subtitle">{{ subtitle() }}</p>
    </div>
    @if (showOnlineBadge()) {
      <span class="badge">
        <span class="badge-dot" aria-hidden="true"></span>
        <span class="badge-text">Sistema en línea</span>
      </span>
    }
  </div>
  <div class="filete-grueso" aria-hidden="true"></div>
  <div class="filete-fino" aria-hidden="true"></div>
</header>
