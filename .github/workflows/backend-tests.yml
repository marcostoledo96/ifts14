name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: test_root_only
          MARIADB_DATABASE: ifts14_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h127.0.0.1 -uroot -ptest_root_only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Build PHP image
        run: docker build -t ifts14-php84 -f docker/php84/Dockerfile .

      - name: Instalar dependencias Composer
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace/apps/backend-php \
            composer:2 \
            composer install --no-dev --no-interaction --prefer-dist

      - name: Composer validate
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace/apps/backend-php \
            composer:2 \
            composer validate --strict

      - name: Composer audit
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace/apps/backend-php \
            composer:2 \
            composer audit

      - name: Unit tests (sin base de datos)
        run: |
          docker run --rm -v "$PWD/apps/backend-php":/app -w /app ifts14-php84 sh -lc '
            php tests/AuthGateTest.php &&
            php tests/AdminSessionAuthTest.php &&
            php tests/AdminAuthHttpTest.php &&
            php tests/AdminAuthorizationMatrixTest.php &&
            php tests/AuthPrivacyTest.php &&
            php tests/NormalizePathTest.php &&
            php tests/EntregaManualTest.php &&
            php tests/AdminCertificateServiceTest.php &&
            php tests/HttpContractTest.php &&
            php tests/PdfResilienceTest.php &&
            php tests/AdminMasterDataServiceTest.php &&
            php tests/SessionHttpTest.php
          '

      - name: Database setup (migraciones)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client >/dev/null
          for f in database/migrations/0*.sql; do
            echo "Aplicando $f..."
            mariadb -h 127.0.0.1 -u root -ptest_root_only ifts14_test < "$f"
          done

      - name: Schema contract
        env:
          IFTS14_TEST_DB_DSN: mysql:host=127.0.0.1;dbname=ifts14_test
          IFTS14_TEST_DB_USER: root
          IFTS14_TEST_DB_PASS: test_root_only
          IFTS14_TEST_DB_ALLOW_RESET: "1"
        run: |
          docker run --rm --network host \
            -v "$PWD":/workspace -w /workspace \
            -e IFTS14_TEST_DB_DSN \
            -e IFTS14_TEST_DB_USER \
            -e IFTS14_TEST_DB_PASS \
            -e IFTS14_TEST_DB_ALLOW_RESET \
            ifts14-php84 php apps/backend-php/tests/DatabaseSchemaContractTest.php

      - name: E2E con MariaDB
        env:
          IFTS14_TEST_DB_DSN: mysql:host=127.0.0.1;dbname=ifts14_test
          IFTS14_TEST_DB_USER: root
          IFTS14_TEST_DB_PASS: test_root_only
          IFTS14_TEST_DB_ALLOW_RESET: "1"
        run: |
          docker run --rm --network host \
            -v "$PWD":/workspace -w /workspace \
            -e IFTS14_TEST_DB_DSN \
            -e IFTS14_TEST_DB_USER \
            -e IFTS14_TEST_DB_PASS \
            -e IFTS14_TEST_DB_ALLOW_RESET \
            ifts14-php84 sh -lc '
              php apps/backend-php/tests/SnapshotEmissionTest.php &&
              php apps/backend-php/tests/HttpEmissionE2eTest.php &&
              php apps/backend-php/tests/AdminMasterDataHttpTest.php &&
              php apps/backend-php/tests/AdminCertificadosConsultaHttpTest.php &&
              php apps/backend-php/tests/ReadinessTest.php &&
              php apps/backend-php/tests/CertificateRevisionMigrationTest.php &&
              php apps/backend-php/tests/AttendanceRevisionTest.php &&
              php apps/backend-php/tests/CourseDateRevisionTest.php &&
              php apps/backend-php/tests/QrImageTest.php &&
              php apps/backend-php/tests/RegenerarPdfTest.php &&
              php apps/backend-php/tests/fault-injection-audit.php
            '

      - name: Upgrade test
        run: bash scripts/test-database-upgrade.sh

      - name: Privacy headers
        run: bash scripts/test-privacy-headers.sh

      - name: PHP lint
        run: |
          docker run --rm -v "$PWD/apps/backend-php":/app -w /app ifts14-php84 sh -lc '
            find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \; | grep -v "^No syntax errors"
          '

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend-angular

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend-angular/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Bloquear focused tests + tests unitarios (Karma headless)
        run: npm run test:ci

      - name: TypeScript strict check (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build producción
        run: npm run build

      - name: Build staging
        run: npm run build -- --configuration production-staging

      - name: Detectar mocks en producción
        run: node scripts/ci-mock-guard.mjs

  security-docs-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: git diff --check
        run: git diff --check origin/main...HEAD

      - name: Enlaces internos
        run: bash scripts/ci-link-check.sh

      - name: Términos obsoletos
        run: bash scripts/ci-obsolete-terms.sh

      - name: OpenSpec huérfano
        run: bash scripts/ci-openspec-orphan-check.sh
