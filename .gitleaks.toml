# .gitleaks.toml — allowlist acotada para ifts14.
# No excluir todo apps/backend-php/tests/: secretos reales ahí deben fallar CI.
# Solo rutas de referencia visual y migraciones SQL versionadas.

[allowlist]
  description = "Allowlist for sample UI export and SQL migrations"
  paths = [
    '''muestra_pagina/''',
    '''database/migrations/''',
  ]
