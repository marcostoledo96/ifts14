# .gitleaks.toml — allowlist acotada para ifts14.
# No excluir todo apps/backend-php/tests/: secretos reales ahí deben fallar CI.
# Solo migraciones SQL versionadas (pueden tener literales ficticios de seed).

[allowlist]
  description = "Allowlist for SQL migrations"
  paths = [
    '''database/migrations/''',
  ]
